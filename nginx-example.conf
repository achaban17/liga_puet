# Приклад для nginx (замініть домен і шлях)
server {
    listen 443 ssl;
    server_name liga.example.edu.ua;
    root /var/www/liga-puet;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json;
    location ~* \.(html|js|json)$ { add_header Cache-Control "no-cache"; }
    location ~* \.png$      { add_header Cache-Control "public, max-age=2592000"; }
}
