<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ліга ПУЕТ</title>
<link rel="icon" type="image/png" href="data/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: той самий кабінет, що й у віртуальному підприємстві — бічна навігація + полотно; розділи змінюються за роллю */
:root{
  --bg:#F1F6F8; --panel:#FFFFFF; --panel2:#F3F8FA; --line:#CDDEE5; --line2:#E0EBF0;
  --ink:#0F2B3F; --ink2:#48617A; --ink3:#7A8FA0;
  --accent:#003653; --accent-ink:#FFFFFF; --accent-soft:#DAEDF4; --accent-mid:#BED8E1;
  --brass:#B4452E; --brass-soft:#FBE6E0;
  --good:#166B40; --good-soft:#DCEFE3; --bad:#B13A2F; --bad-soft:#F6E0DC; --warn:#A8531F; --warn-soft:#FBEADF;
  --coral:#E9674D; --navy:#003653; --navy2:#002B43; --sky:#BED8E1; --sky2:#DAEDF4;
  --d1:#003653; --d2:#DA573C; --d3:#5B8A9E; --d4:#2E6A86; --d5:#1D7A4A; --d6:#E9674D; --d7:#0F3F5D; --d8:#98B1BA;
  --shadow:0 1px 2px rgba(0,54,83,.06),0 6px 18px rgba(0,54,83,.07);
  --f-display:'Montserrat','Arial',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07141F; --panel:#0D2130; --panel2:#12293A; --line:#1F3A4D; --line2:#193142;
  --ink:#E6F0F5; --ink2:#A4BCCB; --ink3:#6F8899;
  --accent:#8FC6DA; --accent-ink:#06202F; --accent-soft:#143548; --accent-mid:#3E7A94;
  --brass:#F08A72; --brass-soft:#3A1F19;
  --good:#5CC98B; --good-soft:#153326; --bad:#EF7B6F; --bad-soft:#3B1E1B; --warn:#F0A070; --warn-soft:#3A2416;
  --coral:#E9674D; --navy:#003653; --navy2:#002B43; --sky:#BED8E1; --sky2:#DAEDF4;
  --d1:#8FC6DA; --d2:#F08A72; --d3:#7FA6B8; --d4:#6FB1CC; --d5:#5CC98B; --d6:#E9674D; --d7:#6F9BC9; --d8:#9DB2B4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07141F; --panel:#0D2130; --panel2:#12293A; --line:#1F3A4D; --line2:#193142;
  --ink:#E6F0F5; --ink2:#A4BCCB; --ink3:#6F8899;
  --accent:#8FC6DA; --accent-ink:#06202F; --accent-soft:#143548; --accent-mid:#3E7A94;
  --brass:#F08A72; --brass-soft:#3A1F19;
  --good:#5CC98B; --good-soft:#153326; --bad:#EF7B6F; --bad-soft:#3B1E1B; --warn:#F0A070; --warn-soft:#3A2416;
  --coral:#E9674D; --navy:#003653; --navy2:#002B43; --sky:#BED8E1; --sky2:#DAEDF4;
  --d1:#8FC6DA; --d2:#F08A72; --d3:#7FA6B8; --d4:#6FB1CC; --d5:#5CC98B; --d6:#E9674D; --d7:#6F9BC9; --d8:#9DB2B4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.2} h2{font-size:16px;line-height:1.3} h3{font-size:14px;line-height:1.35}
p{margin:0}
.muted{color:var(--ink2)} .small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14.5px}
.btn:hover{border-color:var(--accent-mid)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap;max-width:100%}
.me .chip{white-space:normal;text-align:left;line-height:1.3}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.brass{background:var(--brass-soft);border-color:transparent;color:var(--brass)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.soft{background:var(--panel2)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.input,select.input{min-height:46px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);width:100%}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.note{font-size:13px;color:var(--ink2);background:var(--panel2);border:1px dashed var(--line);border-radius:11px;padding:10px 12px}
.err{font-size:13.5px;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:10px 12px}
.ok{font-size:13.5px;color:var(--good);background:var(--good-soft);border-radius:10px;padding:10px 12px}
.segrow{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:4px;background:var(--panel2);padding:4px;border-radius:12px;border:1px solid var(--line)}
@media (max-width:560px){.segrow.wrap{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{border:0;background:transparent;border-radius:9px;padding:8px 6px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;line-height:1.25;font-weight:600;font-size:13.5px;color:var(--ink)}
.seg small{font-weight:500;font-size:11.5px;color:var(--ink2)}
.seg:hover{background:var(--panel)}
.seg.on{background:var(--accent);color:var(--accent-ink)} .seg.on small{color:var(--accent-ink);opacity:.85}

/* login */
.login{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:48px;align-items:start}
@media (max-width:900px){.login{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:24px}}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:50%;background:transparent;display:grid;place-items:center;flex:none;overflow:hidden}.mark img{width:100%;height:100%;object-fit:contain;display:block}
.mark-old{width:42px;height:42px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:14px;font-weight:700;line-height:1.2;color:var(--accent)}
.brand span{font-size:12.5px;color:var(--ink2)}
.hero h1{color:var(--accent);font-size:clamp(26px,3.4vw,38px);line-height:1.12;margin-top:28px}
.hero .lead{font-size:17px;color:var(--ink2);margin-top:14px;max-width:56ch}
.dirs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:26px}
@media (max-width:420px){.dirs{grid-template-columns:minmax(0,1fr)}}
.dir-tile{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.dir-tile i{width:10px;height:36px;border-radius:5px;flex:none}
.dir-tile b{display:block;font-size:13.5px;line-height:1.25}
.dir-tile span{font-size:12px;color:var(--ink2)}
.form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;font-size:14px;color:var(--ink2);min-height:40px}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.role{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:62px}
.role b{font-size:13.5px} .role span{font-size:12px;color:var(--ink2)}
.role.on{border-color:var(--accent);background:var(--accent-soft)}
.role.lock b::after{content:" · код";color:var(--brass);font-weight:600}
.users{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.user{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--panel);text-align:left;width:100%}
.user b{display:block;font-size:13.5px} .user span{font-size:12px;color:var(--ink2)}
.av{width:30px;height:30px;border-radius:50%;background:var(--brass-soft);color:var(--brass);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.av.lg{width:44px;height:44px;font-size:14px}
.av.r-pupil{background:var(--accent-soft);color:var(--accent)} .av.r-college{background:var(--brass-soft);color:var(--brass)}
.av.r-student{background:var(--good-soft);color:var(--good)} .av.r-school_staff,.av.r-uni_teacher{background:var(--warn-soft);color:var(--warn)} .av.r-admin{background:var(--ink);color:var(--panel)}

/* заклад освіти: каскадний вибір із пошуком */
.itypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:6px}
.itypes .seg{min-height:40px;font-size:13px}
.combo{position:relative}
.combo .input{padding-right:34px}
.combo .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:50%;background:var(--panel2);color:var(--ink2);font-size:14px;display:grid;place-items:center}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:260px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none}
.combo.open .combo-list{display:block}
.combo-list button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;font-size:13.5px;line-height:1.3;border-bottom:1px solid var(--line2);color:var(--ink)}
.combo-list button:last-child{border-bottom:0}
.combo-list button:hover,.combo-list button.hl{background:var(--accent-soft)}
.combo-list button small{display:block;color:var(--ink2);font-size:11.5px;margin-top:1px}
.combo-list .empty{padding:10px 12px;font-size:12.5px;color:var(--ink2)}
.combo-list mark{background:transparent;color:var(--accent);font-weight:700}
.picked{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--good-soft);border:1px solid transparent;font-size:13px}
.picked b{display:block;font-size:13.5px;line-height:1.3} .picked span{color:var(--ink2);font-size:12px}
.picked button{margin-left:auto;flex:none}
.combo.disabled .input{opacity:.55}

.demo summary{cursor:pointer;font-size:13px;color:var(--ink2);font-weight:600}
.demo-list{display:flex;flex-direction:column;gap:4px}
.demo-u{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;text-align:left}
.demo-u b{font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.demo-u span{color:var(--ink2)}

.gbtn{gap:8px}
/* проба професії */
.pbprog{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pbprog .track{flex:1;height:6px;border-radius:99px;background:var(--line2);overflow:hidden}.pbprog .track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.pbprog span{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pbcard{max-width:760px}
.pbcard .q{margin:10px 0 10px;font-size:15.5px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .n{background:var(--accent);color:var(--accent-ink)}
.forkout,.outcome{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.55;margin:12px 0}
.forkout .h,.outcome .h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
.scene{background:var(--panel2);border-left:4px solid var(--brass);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.55;margin:10px 0 12px}
.reveal{text-align:center;padding:18px 10px}.reveal .pre{font-size:13.5px;color:var(--ink2);margin-bottom:8px}.reveal .nm{font-family:var(--f-display);font-size:clamp(19px,3vw,25px);font-weight:600;color:var(--accent);line-height:1.25}.reveal .ln{font-size:15px;margin-top:8px}.reveal .disc{margin-top:14px;font-size:13.5px;color:var(--ink2);text-align:left;max-width:60ch;margin-inline:auto}
.verdict-card{border-radius:16px;padding:18px;border:1.5px solid var(--line);background:var(--panel);margin-bottom:14px}
.verdict-card.g{border-color:var(--good)}.verdict-card.w{border-color:var(--brass)}.verdict-card.b{border-color:var(--bad)}
.verdict-card .vname{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}.verdict-card .score{font-family:var(--f-display);font-size:clamp(19px,3vw,26px);font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}.verdict-card .score span{font-size:15px;font-weight:600;color:var(--ink2)}
.g .vname,.g .score{color:var(--good)}.w .vname,.w .score{color:var(--brass)}.b .vname,.b .score{color:var(--bad)}.verdict-card .vtext{margin-top:8px;font-size:14.5px;color:var(--ink2)}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:8px}.bar .lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px;gap:10px}.bar .lab i{font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums}.bar .track{height:10px;border-radius:99px;background:var(--line2);overflow:hidden}.bar .fill{height:100%;border-radius:99px;background:var(--accent)}.bar.dim .fill{background:var(--ink2);opacity:.45}
.rule{height:1px;background:var(--line);border:0;margin:14px 0}
.metrics .m{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px}.metrics .m:last-child{border-bottom:0}.metrics .m .k{color:var(--ink2)}.metrics .m .v{font-weight:600;text-align:right}.metrics .v.good{color:var(--good)}.metrics .v.bad{color:var(--bad)}.metrics .v.warn{color:var(--brass)}
.pcard{border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;background:var(--panel)}.pcard.lead{border-color:var(--accent)}.pcard .rank{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--accent)}.pcard h3{font-family:var(--f-display);font-size:17px;margin:4px 0 2px}.pcard .ln{font-size:14px;color:var(--ink2);margin-bottom:8px}.pcard .sec{margin-top:12px}.pcard .sec .h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:4px}.pcard .sec p{margin:0;font-size:13.5px;line-height:1.55}.pcard ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6}
.pcard .yr{font-size:10.5px;font-weight:700;color:var(--brass);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.facts .f{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13.5px}.facts .f:last-child{border-bottom:0}.facts .f .k{color:var(--ink2)}.facts .f .v{font-weight:600;text-align:right}
.nmt{display:flex;flex-wrap:wrap;gap:6px}.nmt span{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--panel2)}.nmt span b{color:var(--accent)}.nmt span.top{border-color:var(--accent)}
.quad{display:flex;flex-direction:column;gap:8px;margin-top:8px}.quad .q{display:flex;gap:10px;font-size:13.5px;line-height:1.5;align-items:flex-start;margin:0}.quad .q .mark{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}.quad .q .mark.dim{background:var(--ink2);opacity:.5}.quad .q .mark.q2{background:var(--accent);opacity:.45}.quad .q .mark.q1{background:var(--bad);opacity:.75}.quad .q .qfam{font-size:12px;color:var(--brass);display:block}
.fams{display:flex;flex-direction:column;gap:8px;margin-top:6px}.fam{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}.fam.on{border-color:var(--accent);background:var(--accent-soft)}.fam .t{font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:10px}.fam .t i{font-style:normal;font-size:12px;color:var(--ink2)}.fam.on .t i{color:var(--accent)}.fam .s{font-size:12.5px;color:var(--ink2);margin-top:2px}.fam .p{font-size:12px;color:var(--ink2);margin-top:4px}
.stackbar{display:flex;height:26px;border-radius:9px;overflow:hidden;border:1px solid var(--line);margin:10px 0 8px}.stackbar i{display:block;height:100%}.stackbar i.s3,.legend b.s3{background:var(--accent)}.stackbar i.s2,.legend b.s2{background:var(--accent-soft)}.stackbar i.s1,.legend b.s1{background:var(--bad);opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink2)}.legend span{display:inline-flex;align-items:center;gap:6px}.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.discs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dchip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink2);background:var(--panel2)}.dchip b{color:var(--ink);margin-left:2px}.dchip.solo{display:inline-block;margin:0 0 8px;color:var(--brass)}
.famhead{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:14px 0 6px}
.catrow{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px;background:var(--panel2)}.catrow .ct{font-size:15px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}.catrow .cl{font-size:13.5px;color:var(--ink2);margin-top:3px}.catrow .cd{margin-top:4px}
.badge{font-size:11.5px;color:var(--good);border:1px solid var(--good);border-radius:999px;padding:1px 8px;white-space:nowrap}

.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:18px 0 20px}

function rng(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

async function pwHash(salt,pw){const s=salt+'\u0001'+pw;if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}let h1=hashStr(s),h2=hashStr(s+'#2');return h1.toString(16)+h2.toString(16);}

const OLD_KEYS=['puet-liga-abit-v3','puet-liga-abit-v2','puet-liga-abit-v1'];
function migrate(s){
 const fresh=initState();
 const out={...fresh,...s};
 out.reg={...fresh.reg,...(s.reg||{}),q:{...fresh.reg.q,...((s.reg||{}).q||{})},pw:'',pw2:''};
 out.auth=fresh.auth;out.forgot=fresh.forgot;out.insts=s.insts||{};out.season={...fresh.season,...(s.season||{})};
 out.users=(s.users||[]).map(u=>{const n={...u};n.tour=n.tour||{};n.interest=n.interest||{};n.season=n.season||{rounds:{},points:0};
  if(!n.phone&&n.login){const ph=normPhone(n.login);if(ph)n.phone=ph;else if(emailOk(n.login))n.email=n.email||n.login;}
  if(!n.email&&n.login&&emailOk(n.login))n.email=n.login;
  if(!n.phone&&!n.email&&!n.pw&&!n.hash)n.pw='demo';/* профілі з часів входу без пароля */
  return n;});
 // демо-акаунти з попередніх версій отримують телефони для входу
 const seeds=Object.fromEntries(fresh.users.map(u=>[u.id,u]));
 out.users.forEach(u=>{const sd=seeds[u.id];if(sd){if(!u.phone)u.phone=sd.phone;if(!u.email)u.email=sd.email;}});
 out.teams=(s.teams||[]).map(t=>({...t,rounds:t.rounds||{},members:t.members||[]}));

}

function probaOf(u){
 if(!u.proba)u.proba={visits:0,lastQuartet:[],lastVariants:{},seen:{},deepDone:{},famSeen:{},weekRuns:{},weekBest:{},pullBase:{},runs:[],weeks:[]};
 const m=u.proba;['seen','deepDone','famSeen','weekRuns','weekBest','pullBase','lastVariants'].forEach(k=>{if(!m[k])m[k]={};});
 if(!m.runs)m.runs=[];if(!m.weeks)m.weeks=[];if(!m.lastQuartet)m.lastQuartet=[];return m;
}
const pbRand=n=>Math.floor(Math.random()*n);
function pbShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=pbRand(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
const optByKey=(opts,k)=>opts.find(o=>o.k===k)||opts[0];
/* порядок програм у родині: спершу ті, яких учасник ще не бачив */
function familyOrder(m,fam){return pbShuffle(PM.progsOf(fam)).sort((a,b)=>(m.seen[a]||0)-(m.seen[b]||0));}
function nextPullBase(m,prog){const n=PP[prog].pulls.length,last=m.pullBase[prog];const b=typeof last==='number'?(last+1+pbRand(n-1))%n:pbRand(n);m.pullBase[prog]=b;return b;}
function pullLine(play,prog,day){const l=PP[prog].pulls;return l[(((play.pullPick&&play.pullPick[prog])||0)+day)%l.length];}
function nextVariant(m,prog){const list=PM.EPISODE_POOL[prog],last=m.lastVariants[prog],pool=[];for(let i=0;i<list.length;i++)if(i!==last)pool.push(i);return (pool.length?pool:[0])[pbRand(Math.max(1,pool.length))];}
function nextDeepVariant(m,prog){const list=PM.DEEP_POOL[prog],done=m.deepDone[prog]||[];let pool=[];for(let i=0;i<list.length;i++)if(!done.includes(i))pool.push(i);if(!pool.length)pool=list.map((_,i)=>i);return pool[pbRand(pool.length)];}

  step:0,steps:[],forkL1:[],forkL2:[],groupRanked:null,groupScore:null,candidates:null,l2Order:null,famRanked:null,famScore:null,
  quartet:null,variants:null,srcs:null,pullPick:null,bOrder:null,ownFam:null,A:[],A2:[],B:[],day:null,deepProg:null,deepSrc:null,deep:[],optOrders:{},done:false,startedAt:today()};
 if(!isCollegeRun(p))for(let i=0;i<PM.FORK_L1.length;i++)p.steps.push({t:'forkL1',i});
 for(let i=0;i<PM.FORK_L2.length;i++)p.steps.push({t:'forkL2',i});
 p.steps.push({t:'handoff'});
 for(let i=0;i<4;i++){p.steps.push({t:'epA',i});p.steps.push({t:'epA2',i});p.steps.push({t:'epB',i});p.steps.push({t:'reveal',i});}
 if(level>=2){p.steps.push({t:'day'});p.steps.push({t:'deepIntro'});p.steps.push({t:'deep',j:0});p.steps.push({t:'deep',j:1});}

/* демо: автоматичне проходження з випадковими рішеннями (щоб кабінети школи й куратора не були порожніми) */
function simulateProba(u,bias){
 const p=buildProba(u);
 for(let s=0;s<p.steps.length;s++){const st=p.steps[s];p.step=s;
  if(st.t==='forkL1'){const f=PM.FORK_L1[st.i];pbPick(u,p,f.opts[pbRand(f.opts.length)].k);}
  else if(st.t==='forkL2'){if(!p.candidates)resolveCandidates(p);pbPick(u,p,p.l2Order[st.i][pbRand(p.l2Order[st.i].length)]);}
  else if(st.t==='handoff'){if(!p.quartet)resolveQuartet(u,p);}
  else if(st.t==='epA'||st.t==='epA2'||st.t==='deep'){const src=st.t==='deep'?curDeep(p).steps[st.j]:situationAt(p,st.i).steps[st.t==='epA'?0:1];const opts=src.opts;const good=opts.filter(o=>o.quality===3)[0];pbPick(u,p,(Math.random()<(bias||.5)&&good?good:opts[pbRand(opts.length)]).k);}
  else if(st.t==='epB')pbPick(u,p,p.bOrder[st.i][pbRand(4)]);
  else if(st.t==='reveal'){}
  else if(st.t==='day')pbPick(u,p,p.quartet[pbRand(4)]);
  else if(st.t==='deepIntro'){if(p.deepProg!==p.day)prepareDeep(u,p);}
 }
 return finishProba(u,p);
}
function simulateWeek(u,prog,bias){const steps=PM.WEEK_POOL[prog].steps,p={kind:'week',prog,step:0,picks:[],optOrders:{},done:false};steps.forEach((st,i)=>{const good=st.opts.find(o=>o.quality===3);p.picks[i]=(Math.random()<(bias||.5)&&good?good:st.opts[pbRand(st.opts.length)]).k;});return finishWeek(u,p);}

function resolveCandidates(p){
 if(isCollegeRun(p)){p.ownFam=p.field;const pool=[];PGO.forEach(g=>{if(PGRP[g].fams.includes(p.ownFam))return;PGRP[g].fams.forEach(f=>pool.push(f));});p.groupRanked=PGO.slice();p.candidates=pbShuffle(pool).slice(0,4);}
 else{const gr=PM.forkGroups(p.forkL1,pbShuffle(PGO));p.groupScore=gr.groupScore;p.groupRanked=gr.groupRanked;p.candidates=PM.candidateFamilies(gr.groupRanked);}
 p.l2Order=[];for(let i=0;i<PM.FORK_L2.length;i++)p.l2Order.push(pbShuffle(p.candidates));
}
function resolveQuartet(u,p){
 const m=probaOf(u),fr=PM.forkFamilies(p.candidates,p.forkL2,pbShuffle(p.candidates));p.famScore=fr.famScore;p.famRanked=fr.famRanked;
 const sh={};p.candidates.forEach(f=>{sh[f]=familyOrder(m,f);});let ranked;
 if(isCollegeRun(p)){sh[p.ownFam]=familyOrder(m,p.ownFam);ranked=[p.ownFam].concat(fr.famRanked.filter(f=>f!==p.ownFam));}else ranked=fr.famRanked;
 p.quartet=pbShuffle(PM.pickQuartet(ranked,sh));p.variants={};p.pullPick={};p.bOrder=[];p.srcs=[];
 p.quartet.forEach((k,i)=>{p.variants[k]=nextVariant(m,k);p.pullPick[k]=nextPullBase(m,k);
  /* випускник коледжу за своїм напрямом отримує задачу рівня бакалаврату */
  p.srcs[i]=isCollegeRun(p)&&PP[k].fam===p.ownFam?{t:'deep',v:nextDeepVariant(m,k)}:{t:'ep',v:p.variants[k]};});

function profEditStart(u){const r=S.reg,i=(S.insts||{})[u.inst];r.role=u.role;r.name=u.name;r.phone=fmtPhone(u.phone)||'';r.grade=u.grade||11;r.course=u.course||1;r.field=u.field||'other';r.position=u.position||'вчитель';r.program=u.program||PROGRAMS_UNI[0];r.group=u.group||'';r.region=i&&i.region||'';r.city=i&&i.city||'';r.itype=i&&i.type||(ITYPES_FOR[u.role]||['l'])[0];r.instId=i?u.inst:'';r.instName=i?i.name:'';r.q={region:'',city:'',inst:''};r.open='';S.pedit=true;}
function profEditSave(){
 const u=me(),r=S.reg,needInst=u.role==='pupil'||u.role==='college'||u.role==='school_staff';
 if(!r.name.trim()){S.msg='Вкажіть ім’я та прізвище.';return;}
 const phone=normPhone(r.phone);if(!phone){S.msg='Вкажіть номер телефону у форматі +380 XX XXX XX XX.';return;}
 if(S.users.some(x=>x.id!==u.id&&x.phone===phone)){S.msg='Цей номер уже використовує інший учасник.';return;}
 if(needInst&&!r.instId&&(r.region||r.q.region||r.q.city||r.q.inst)){S.msg='Заклад не обрано: виберіть його зі списку або очистіть поля області й населеного пункту, щоб залишити попередній.';return;}
 const before={inst:u.inst,grade:u.grade,course:u.course,field:u.field,position:u.position,program:u.program,group:u.group,name:u.name};
 u.name=r.name.trim();if(u.login===u.phone)u.login=phone;u.phone=phone;
 if(needInst&&r.instId&&r.instId!==u.inst){S.insts=S.insts||{};if(!S.insts[r.instId])S.insts[r.instId]={id:r.instId,name:r.instName,kind:ITYPES[r.itype].kind,type:r.itype,region:r.region,city:r.city};u.inst=r.instId;}
 if(u.role==='pupil')u.grade=+r.grade;
 if(u.role==='college'){u.course=+r.course;u.field=r.field||u.field;}
 if(u.role==='student'){u.course=+r.course;u.program=r.program;u.group=(r.group||'').trim();}
 if(u.role==='school_staff')u.position=r.position;
 const ch=Object.keys(before).filter(k=>before[k]!==u[k]);
 let note='';
 if(ch.length){u.history=u.history||[];const prev={};ch.forEach(k=>prev[k]=before[k]);u.history.push({at:today(),prev,instName:INST[before.inst]?INST[before.inst].name:''});}
 if(before.inst!==u.inst){const t=userTeam(u);if(t){t.members=t.members.filter(id=>id!==u.id);t.left=t.left||[];t.left.push({id:u.id,at:today()});note=' Ви вийшли з команди попереднього закладу; її результати збережено.';}}
 r.instId='';r.instName='';r.region='';r.city='';r.q={region:'',city:'',inst:''};r.name='';r.phone='';
 S.pedit=false;S.msg=(ch.length?'Профіль оновлено. Попередні дані й усі результати збережено в історії.':'Змін немає.')+note;
}

function seriesChart(series,stepName){

 return `<div class="sp-charts">${series.map(m=>{const v=m.vals.filter(x=>typeof x==='number'&&isFinite(x));if(v.length<3)return '';let lo=Math.min(...v),hi=Math.max(...v);if(hi===lo){hi=lo+1;lo=lo-1;}const X=i=>L+i*(W-L-R)/(v.length-1),Y=x=>TP+(hi-x)/(hi-lo)*(H-TP-B);
  const d=v.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1)).join(' '),last=v.length-1;
  return `<figure class="sp-chart"><figcaption>${ic(m.icon||'gauge')}<span>${esc(m.label)}</span></figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.label)}: від ${f(v[0])} до ${f(v[last])}"><path d="M${L} ${H-B}H${W-R}" class="ax"/><path d="${d} L${X(last)} ${H-B} L${X(0)} ${H-B}Z" class="ar"/><path d="${d}" class="ln"/>${v.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x).toFixed(1)}" r="${i===0||i===last?4:2.2}" class="${i===0||i===last?'pe':'pm'}"><title>${i?(stepName||'Крок')+' '+i:'Початок'}: ${f(x)} ${esc(m.unit||'')}</title></circle>`).join('')}<text x="${L}" y="${H-4}" class="tx">початок: ${f(v[0])}</text><text x="${W-R}" y="${H-4}" class="tx" text-anchor="end">зараз: ${f(v[last])}</text></svg></figure>`;}).join('')}</div>`;}

async function register(){
 const r=S.reg,role=ROLES[r.role];
 if(!r.name.trim()){S.err='Вкажіть ім’я та прізвище.';return;}
 const phone=normPhone(r.phone),email=normEmail(r.email);
 if(!phone){S.err='Вкажіть номер телефону у форматі +380 XX XXX XX XX — це ваш логін.';return;}
 if(S.users.some(x=>x.phone===phone)){S.err='Цей номер уже зареєстровано. Увійдіть або відновіть пароль.';return;}
 if(!emailOk(email)){S.err='Вкажіть email — він потрібен для відновлення пароля.';return;}
 if(S.users.some(x=>x.email===email&&x.role!=='pupil')||S.users.filter(x=>x.email===email).length>=3){S.err='Цей email уже використовується. Для кількох дітей одна батьківська адреса допускається (до трьох профілів).';return;}
 if((r.pw||'').length<6){S.err='Пароль має бути не коротший за 6 символів.';return;}
 if(r.pw!==r.pw2){S.err='Паролі не збігаються.';return;}
 if(role.code&&r.code.trim().toUpperCase()!==role.code){S.err='Невірний код запрошення для цієї ролі.';return;}
 const needInst=r.role==='pupil'||r.role==='college'||r.role==='school_staff';
 if(needInst&&!r.instId){S.err=!r.region?'Оберіть область.':!r.city?'Оберіть населений пункт.':'Оберіть заклад освіти зі списку.';return;}
 const u={id:uid(),name:r.name.trim(),phone,email,login:phone,role:r.role,created:today(),tour:{},interest:{},season:{rounds:{},points:0}};
 await setPassword(u,r.pw);
 if(needInst){S.insts=S.insts||{};if(!S.insts[r.instId])S.insts[r.instId]={id:r.instId,name:r.instName,kind:ITYPES[r.itype].kind,type:r.itype,region:r.region,city:r.city};u.inst=r.instId;}
 if(r.role==='pupil')u.grade=+r.grade;
 else if(r.role==='college'){u.course=+r.course;u.field=r.field||'other';}
 else if(r.role==='student'){u.inst='puet';u.program=r.program;u.course=+r.course;u.group=(r.group||'').trim();}
 else if(r.role==='school_staff')u.position=r.position;
 else u.inst='puet';
 S.users.push(u);sendToSheet('Реєстрація',Object.assign(sheetUser(u),{область:r.region||'',місто:r.city||'',тип_закладу:needInst?(ITYPES[r.itype]||{}).label||'':'',напрям_коледж:u.field||''}));S.me=u.id;S.view='app';S.tab='home';S.err='';Object.assign(r,{name:'',phone:'',email:'',pw:'',pw2:'',gnote:'',code:'',region:'',city:'',instId:'',instName:'',q:{region:'',city:'',inst:''},open:''});S.msg='Профіль створено. '+(u.role==='pupil'||u.role==='college'?'Починайте з туру напрямами.':'');
}

async function forgotStep(){
 const F=S.forgot;
 if(F.step===1){const u=findUser(F.id);if(!u||!u.email){S.err='Профіль з таким телефоном або email не знайдено. Зверніться до вчителя-координатора або адміністратора ліги.';return;}
  const code=String(Math.floor(100000+Math.random()*900000));u.resetCode=code;u.resetUntil=Date.now()+15*60*1000;
  const [a,b]=u.email.split('@');F.maskedEmail=a.slice(0,2)+'•••@'+b;F.uid=u.id;F.demoCode=code;/* у продакшені код іде листом, а не на екран */F.step=2;S.err='';return;}

 if(!u||u.resetCode!==(F.code||'').trim()||Date.now()>u.resetUntil){S.err='Невірний або прострочений код. Запросіть новий.';return;}
 if((F.pw||'').length<6){S.err='Пароль має бути не коротший за 6 символів.';return;}
 if(F.pw!==F.pw2){S.err='Паролі не збігаються.';return;}
 await setPassword(u,F.pw);delete u.resetCode;delete u.resetUntil;S.forgot={step:1,id:'',code:'',pw:'',pw2:''};S.loginTab='in';S.err='';S.auth.login=u.phone;S.msg='';S.authNote='Пароль змінено. Увійдіть з новим паролем.';
}

}

   case 'email-save':{const v2=normEmail((document.getElementById('pr-email')||{}).value);if(!emailOk(v2)){S.msg='Вкажіть коректний email.';break;}me().email=v2;S.msg='Email збережено.';break;}
   case 'pw-reset':{const m=me(),x=S.users.find(y=>y.id===v);if(!x||!m)return;if(!(m.role==='admin'||(m.role==='school_staff'&&x.inst===m.inst&&(x.role==='pupil'||x.role==='college'))))return;const tmp='tmp-'+Math.random().toString(36).slice(2,8);x.pw=tmp;delete x.hash;delete x.salt;S.msg=`Тимчасовий пароль для ${x.name}: ${tmp}. Передайте особисто; після входу учасник змінить його у профілі.`;break;}
   case 'logout':S.pedit=false;S.spView=null;if(S.sp&&!S.sp.done&&S.sp.i>=0&&me())me().spSave=S.sp;S.sp=null;S.me=null;S.view='login';S.play=null;S.loginTab='in';S.err='';S.msg='';window.scrollTo(0,0);break;
   case 'reset':if(me()&&me().role!=='admin')return;localStorage.removeItem(KEY);S=initState();break;
   case 'tab':S.pedit=false;S.spView=null;if(S.sp)S.sp.open=false;S.tab=(PR_TABS.includes(v)&&me()&&me().role==='student')?'pr-'+v:v;S.roundOpen=null;S.openCard=null;window.scrollTo(0,0);break;
   case 'go-coord':if(me().role==='uni_teacher'||me().role==='admin')S.tab='coord';break;
   case 'pb-start':if(!PM)return;startProba(me());window.scrollTo(0,0);break;
   case 'pb-again':if(!PM)return;startProba(me());window.scrollTo(0,0);break;
   case 'pb-resume':if(!S.play)return;S.tab='play';window.scrollTo(0,0);break;
   case 'pb-abandon':S.play=null;S.tab='tour';break;
   case 'pb-close':S.play=null;S.tab='home';S.msg='Результат збережено у профілі.';window.scrollTo(0,0);break;
   case 'pb-pick':{const p=S.play;if(!p)return;if(p.kind==='week')pbWeekPick(p,el.dataset.k);else pbPick(me(),p,el.dataset.k);break;}
   case 'pb-next':{const p=S.play;if(!p)return;pbNext(me(),p);window.scrollTo(0,0);break;}
   case 'pb-back':{const p=S.play;if(!p)return;pbBack(me(),p);window.scrollTo(0,0);break;}
   case 'pb-week':if(!PM||!LEVELS[levelOf(me())].weeks)return;startWeek(me(),v);window.scrollTo(0,0);break;
   case 'pb-card':S.openCard=S.openCard===v?null:v;break;
   case 'join':{const code=(document.getElementById('join-code')||{}).value||'';const t=S.teams.find(x=>x.code.toLowerCase()===code.trim().toLowerCase());if(!t){S.msg='';S.err='';alertMsg('Команду з таким кодом не знайдено.');return;}joinTeam(t);break;}
   case 'join-id':{const t=S.teams.find(x=>x.id===v);if(t)joinTeam(t);break;}
   case 'create-team':{const name=((document.getElementById('team-name')||{}).value||'').trim();if(!name){alertMsg('Введіть назву команди.');return;}const u=me(),lr=latestRun(u);const t={id:'T'+(S.teams.length+1),name,inst:u.inst,members:[u.id],mentor:null,dir:lr?dirOfProg(lr.top):'horeca',code:name.replace(/[^A-Za-zА-Яа-яІіЇїЄє0-9]/g,'').slice(0,4).toUpperCase()||'TEAM'+(S.teams.length+1),rounds:{},points:0};S.teams.push(t);const ss=seasonOf(t);ss.captain=u.id;S.msg=`Команду створено. Код для колег: ${t.code}.`;break;}
   case 'leave-team':{const t=userTeam(me());if(t){t.members=t.members.filter(id=>id!==S.me);if(!t.members.length)S.teams=S.teams.filter(x=>x.id!==t.id);}break;}
   case 'role-pick':{const t=userTeam(me());if(!t)return;seasonOf(t).roles[me().id]=v;break;}
   case 'round':S.roundOpen=v==='pitch'?'pitch':+v;break;
   case 'round-close':S.roundOpen=null;break;
   case 'round-team':{const t=userTeam(me()),i=S.roundOpen;if(!t||typeof i!=='number'||roundStatus(t,i)!=='open')return;const rr=roundRec(t,i);if(rr.team)return;rr.team={o:+v,by:me().id,at:today()};break;}
   case 'round-role':{const t=userTeam(me()),i=S.roundOpen;if(!t||typeof i!=='number'||roundStatus(t,i)!=='open')return;const role=myRole(t,me());if(!role)return;const rr=roundRec(t,i);if(rr.roles[me().id])return;rr.roles[me().id]={k:role,a:+v,q:SR[i].roles[role].o[+v].quality,at:today()};break;}
   case 'round-q':{const t=userTeam(me()),i=S.roundOpen;if(!t||typeof i!=='number'||roundStatus(t,i)!=='open')return;const rr=roundRec(t,i);if(rr.quiz[me().id]!=null)return;rr.quiz[me().id]=(+v===SR[i].quiz.a);break;}
   case 'round-finish':{const t=userTeam(me());if(!t)return;if(closeRound(t,+v)){const r=seasonOf(t).rounds[+v].result;S.msg=`Тиждень ${+v+1} закрито: ${r.points} балів. ${r.after}`;}break;}
   case 'pitch-submit':{const t=userTeam(me());if(!t)return;const pch=seasonOf(t).pitch;['what','decision','result'].forEach(k=>{const el=document.getElementById('pitch-'+k);if(el)pch[k]=el.value;});if([pch.what,pch.decision,pch.result].some(x=>(x||'').trim().length<30)){S.msg='Кожен блок виступу — щонайменше 30 знаків: журі має побачити зміст.';break;}pch.submitted=true;pch.at=today();S.msg='Виступ подано. Оцінку журі внесуть після фіналу.';break;}
   case 'mentor-save':{const t=S.teams.find(x=>x.id===v),m=me();if(!t||!m)return;if(!((m.role==='school_staff'&&m.inst===t.inst)||m.role==='admin'))return;const i=+el.dataset.k,rr=roundRec(t,i);const sc=+((document.getElementById(`mr-score-${t.id}-${i}`)||{}).value||0),cm=((document.getElementById(`mr-comment-${t.id}-${i}`)||{}).value||'').trim();rr.mentor={score:Math.max(0,Math.min(5,sc)),comment:cm,by:m.id,at:today()};S.msg=`Оцінку тижня ${i+1} для «${t.name}» збережено.`;break;}
   case 'jury-save':{const t=S.teams.find(x=>x.id===v),m=me();if(!t||!m||m.role!=='admin')return;const sc=+((document.getElementById(`jury-score-${t.id}`)||{}).value||0),cm=((document.getElementById(`jury-comment-${t.id}`)||{}).value||'').trim();seasonOf(t).jury={score:Math.max(0,Math.min(30,sc)),comment:cm,by:m.id,at:today()};S.msg=`Оцінку журі для «${t.name}» збережено.`;break;}
   default:{const u=me();if(VS&&u&&a.indexOf('vs-')===0){if((u.role==='pupil'||u.role==='college')&&S.tab==='vstup'&&VS.onAct(a,v,el,u)){save();render();if(/^vs-(tab|start|next|confirm|decline|take|call|quit|extra-send|extra-take|extra-again)$/.test(a))window.scrollTo(0,0);}return;}if(PR&&u&&prBindFor(u)){if(PR.onAct(a,el.dataset.k,v,el)){save();render();}}return;}
  }
  save();render();
  if(a==='combo-pick'||a==='combo-clear'){const n=document.getElementById('c-'+S.reg.open);if(n)n.focus();}
 });
 function alertMsg(m){S.msg=m;save();render();}
 function joinTeam(t){const u=me();if(t.members.length>=6){S.msg='У команді вже 6 учасників.';return;}if(t.inst!==u.inst){S.msg='Команда з іншого закладу. Приєднатися можна лише до команди свого закладу.';return;}S.teams.forEach(x=>x.members=x.members.filter(id=>id!==u.id));t.members.push(u.id);S.msg=`Ви в команді ${t.name}.`;}
 document.addEventListener('change',e=>{
  const t=e.target;
  if(VS&&t.dataset.vs&&me()&&S.tab==='vstup'){if(VS.onChange(t,me())){save();if(t.tagName==='SELECT')render();else{clearTimeout(vsT);vsT=setTimeout(()=>{vsT=0;render();},250);}}return;}
  if(PR&&me()&&(t.dataset.actChange||t.dataset.cnt||t.dataset.u)&&prBindFor(me())){if(PR.onChange(e)){save();render();return;}}
  if(t.dataset.reg){S.reg[t.dataset.reg]=t.value;save();return;}
  if(t.dataset.role){const u=S.users.find(x=>x.id===t.dataset.role);if(u){u.role=t.value;if(!u.tour)u.tour={};if(!u.interest)u.interest={};save();render();}return;}
  if(t.dataset.season){S.season[t.dataset.season]=t.value;save();return;}
  if(t.dataset.field){const u=me();if(u&&u.id===t.dataset.field){u.field=t.value;save();render();}return;}
 });
 document.addEventListener('input',e=>{const t=e.target;if(t.dataset.spf&&S.sp&&S.sp.cur&&S.sp.cur.vals){S.sp.cur.vals[t.dataset.spf]=t.value;return;}if(t.id==='sp-input'&&S.sp){S.sp.input=t.value;return;}if(t.dataset.pitch){const tm=userTeam(me());if(tm){seasonOf(tm).pitch[t.dataset.pitch]=t.value;save();}return;}if(PR&&me()&&(t.dataset.pq!=null||t.dataset.cf||t.dataset.memo||t.dataset.rec||t.dataset.prin||(t.dataset.u&&t.tagName==='INPUT'))&&prBindFor(me())){if(PR.onInput(e)){save();return;}}if(t.dataset.auth){S.auth[t.dataset.auth]=t.value;return;}if(t.dataset.forgot){S.forgot[t.dataset.forgot]=t.value;return;}if(t.dataset.reg){S.reg[t.dataset.reg]=t.value;if(!/^(pw|pw2)$/.test(t.dataset.reg))save();}
  if(t.dataset.combo){const k=t.dataset.combo,r=S.reg;r.q[k]=t.value;if(k==='region'){r.region='';r.city='';r.instId='';r.instName='';r.q.city='';r.q.inst='';}if(k==='city'){r.city='';r.instId='';r.instName='';r.q.inst='';}if(k==='inst'){r.instId='';r.instName='';}r.open=k;const pos=t.selectionStart;render();const n=document.getElementById('c-'+k);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}}});
 document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.combo){S.reg.open=t.dataset.combo;document.querySelectorAll('.combo.open').forEach(n=>n.classList.remove('open'));const c=t.closest('.combo');if(c)c.classList.add('open');if(t.value)try{t.select();}catch(_){}}});
 document.addEventListener('pointerdown',e=>{if(S.reg.open&&!e.target.closest('.combo')){S.reg.open='';document.querySelectorAll('.combo.open').forEach(n=>n.classList.remove('open'));}});
 document.addEventListener('keydown',e=>{const t=e.target;if((t.id==='sp-input'||t.dataset.spf)&&e.key==='Enter'){e.preventDefault();const b=document.querySelector('[data-act="sp-check"]');if(b)b.click();return;}if(t.dataset&&t.dataset.combo){if(e.key==='Enter'){e.preventDefault();const b=t.parentElement.querySelector('.combo-list button');if(b)b.click();}if(e.key==='Escape'){S.reg.open='';render();}}});
 document.addEventListener('submit',e=>{if(e.target.id==='regForm'){e.preventDefault();register().then(()=>{save();render();window.scrollTo(0,0);});}if(e.target.id==='authForm'){e.preventDefault();signIn().then(()=>{save();render();window.scrollTo(0,0);});}if(e.target.id==='forgotForm'){e.preventDefault();forgotStep().then(()=>{save();render();});}});
 window.addEventListener('hashchange',()=>{const k=entryFromHash();if(k&&S.view==='login'){setEntry(k);render();}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.roundOpen!=null){S.roundOpen=null;render();}if(e.key==='Escape'&&PR&&me()&&S.tab.startsWith('pr-')){prBind(me());if(PR.onKey(e)){save();render();}}});
 render();
}
</script>
